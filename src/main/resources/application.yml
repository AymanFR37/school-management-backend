server:
  port: 9090

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/school_db
    username:
    password:

  jpa:
    properties:
      hibernate:
        jdbc:
          lob:
            non_contextual_creation: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

    hibernate:
      ddl-auto: create
    show-sql: true

  profiles:
    active: dev